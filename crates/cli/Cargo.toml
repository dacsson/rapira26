[package]
name = "cli"
version = "0.1.3"
edition = "2024"

[[bin]]
name = "рапик"
path = "src/main.rs"

[dependencies]
annotate-snippets = "0.12.13"
clap = { version = "4.6.0", features = ["derive"] }
petgraph = "0.8.3"
log = "0.4"
env_logger = "0.11.10"
vm-core = { path = "../vm-core" }
compiler-core = { path = "../compiler-core" }
vm-interp = { path = "../vm-interp" }
# Provides `runtime_error_description`, referenced by the C runtime's
# RAP_fatal_error. Linked as an rlib so std is shared with the binary.
raperr = { path = "../../runtime/raperr" }
